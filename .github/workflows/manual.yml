name: Database Automation

on:
  workflow_dispatch:

  schedule:
    - cron: '30 7 * * *'   # 1:00 PM IST

jobs:
  database-job:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python
        shell: powershell
        run: |
          python --version
          pip --version

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python script
        shell: powershell
        run: |
          python main.py
